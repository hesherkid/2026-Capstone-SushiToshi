name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the older, now-outdated run on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend - build, unit & integration tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      # Used dotnet test to restore, build, and run the unit tests
      - name: Run unit tests
        run: dotnet test src/back-end.Tests/back-end.Tests.csproj

      - name: Run integration tests
        run: dotnet test src/back-end.IntegrationTests/back-end.IntegrationTests.csproj
        env:
          SendGrid__ApiKey: ci-placeholder-not-a-real-key
          SendGrid__FromEmail: ci@example.com

  frontend-tests:
    name: Frontend - lint, unit tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/front-end
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (warnings only - does not fail the job)
        run: npm run lint
        continue-on-error: true

      - name: Run unit tests (with coverage)
        run: npm test -- --ci --coverage

      - name: Build
        run: npm run build

  # End-to-end tests against the full app: database + API + website.
  # Runs on every PR, after merges to main and from "Run workflow". Is a required check.
  e2e-tests:
    name: E2E tests - Playwright, ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: "chromium", browser: chromium, slug: chromium }
          - { project: "firefox", browser: firefox, slug: firefox }
          - { project: "webkit", browser: webkit, slug: webkit }
          - { project: "Mobile Chrome", browser: chromium, slug: mobile-chrome }
          - { project: "Mobile Safari", browser: webkit, slug: mobile-safari }

    services:
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_DATABASE: sushi_toshi_db
          MARIADB_USER: app_user
          MARIADB_PASSWORD: app_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5264
      ConnectionStrings__MySqlConnection: "Server=127.0.0.1;Port=3307;Database=sushi_toshi_db;User=app_user;Password=app_password;"
      SendGrid__ApiKey: ci-placeholder-not-a-real-key
      SendGrid__FromEmail: ci@example.com

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/front-end/package-lock.json

      - name: Install font library for QR codes (SkiaSharp)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Start backend
        working-directory: src/back-end
        run: |
          nohup dotnet run --no-launch-profile > backend.log 2>&1 &
          for i in $(seq 1 100); do
            curl -sf http://localhost:5264/db-test && exit 0
            sleep 3
          done
          echo "Backend did not start - log below"; cat backend.log; exit 1

      - name: Set up frontend and Playwright
        working-directory: src/front-end
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium ${{ matrix.browser }}

      - name: Run E2E tests
        working-directory: src/front-end
        run: npx playwright test --project="${{ matrix.project }}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.slug }}
          path: src/front-end/playwright-report
  e2e-all-browsers:
    # This gives one required check instead of multiple checks for each browser
    # Adding or removing a browser will not require changing branch protection rules
    name: E2E tests - all browsers
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    # always() is required so this job runs even if some browser tests fail
    if: always()
    steps:
      - name: Check every browser passed
        run: test "${{ needs.e2e-tests.result }}" = "success"
